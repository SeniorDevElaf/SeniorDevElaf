# Rebuilds the activity card and the contribution snake, then publishes both
# to the `output` branch that the README reads them from.
name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs before snk so dist/ is created by the runner user.
      - name: Activity card
        run: python3 scripts/build.py stats --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#EC4899&color_dots=#161b22,#3b1f6e,#6d3fd1,#8b5cf6,#c4b5fd
            dist/snake-light.svg?color_snake=#8B5CF6&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
