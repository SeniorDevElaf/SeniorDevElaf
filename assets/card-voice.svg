<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="Offline Voice to Text"><title>Offline Voice to Text</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}}.comet{animation:comet 8s linear infinite}@keyframes comet{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.3);opacity:0}}.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{opacity:0;transform:scale(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.halo{transform-box:fill-box;transform-origin:center;animation:halo 7s ease-in-out infinite}@keyframes halo{50%{transform:translate(40px,20px) scale(1.2)}}</style><defs><clipPath id="clip"><rect width="480" height="250" rx="18"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090D17"/><stop offset="1" stop-color="#0E1323"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".6"/><stop offset=".5" stop-color="#222B3D"/><stop offset="1" stop-color="#06B6D4" stop-opacity=".5"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern><radialGradient id="halo"><stop offset="0" stop-color="#06B6D4" stop-opacity=".28"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#clip)"><rect width="480" height="250" fill="url(#bg)"/><rect width="480" height="250" fill="url(#dots)"/><circle class="halo" cx="60" cy="40" r="170" fill="url(#halo)"/><rect x="28" y="28" width="52" height="52" rx="14" fill="#06B6D4" fill-opacity=".16" stroke="#06B6D4" stroke-opacity=".5"/><g transform="translate(39,39) scale(1.25)" fill="none" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4M8 22h8"/></g><text x="96" y="52" class="s" font-size="21" font-weight="700" fill="#F0F3F8">Offline Voice to Text</text><text x="97" y="74" class="m" font-size="11.5" letter-spacing="1.6" fill="#67E8F9">DESKTOP APP</text><rect x="344.2" y="27" width="107.8" height="24" rx="12" fill="#06B6D4" fill-opacity=".12" stroke="#06B6D4" stroke-opacity=".5"/><text x="398.1" y="43" class="m" font-size="11" font-weight="700" letter-spacing="1.2" fill="#67E8F9" text-anchor="middle">OPEN SOURCE</text><text x="28" y="122" class="s" font-size="15" fill="#9BA3B4">Hold a hotkey, speak, and text appears in any app.</text><text x="28" y="146" class="s" font-size="15" fill="#9BA3B4">Whisper.cpp runs fully offline on your machine.</text><rect x="28" y="190" width="67" height="28" rx="14" fill="#141C2E" stroke="#222B3D"/><text x="61.5" y="208.5" class="m" font-size="12.5" fill="#C9D1D9" text-anchor="middle">Python</text><rect x="103" y="190" width="104.5" height="28" rx="14" fill="#141C2E" stroke="#222B3D"/><text x="155.25" y="208.5" class="m" font-size="12.5" fill="#C9D1D9" text-anchor="middle">Whisper.cpp</text><rect x="215.5" y="190" width="74.5" height="28" rx="14" fill="#141C2E" stroke="#222B3D"/><text x="252.75" y="208.5" class="m" font-size="12.5" fill="#C9D1D9" text-anchor="middle">Desktop</text></g><path d="M18,0.75H462A17.25,17.25 0 0 1 479.25,18V232A17.25,17.25 0 0 1 462,249.25H18A17.25,17.25 0 0 1 0.75,232V18A17.25,17.25 0 0 1 18,0.75Z" fill="none" stroke="url(#edge)" stroke-width="1.5"/><path d="M18,0.75H462A17.25,17.25 0 0 1 479.25,18V232A17.25,17.25 0 0 1 462,249.25H18A17.25,17.25 0 0 1 0.75,232V18A17.25,17.25 0 0 1 18,0.75Z" pathLength="1000" fill="none" stroke="#06B6D4" stroke-linecap="round" class="comet" style="animation-duration:8s;animation-delay:-1.3s" stroke-width="5" stroke-opacity=".18" stroke-dasharray="160 840"/><path d="M18,0.75H462A17.25,17.25 0 0 1 479.25,18V232A17.25,17.25 0 0 1 462,249.25H18A17.25,17.25 0 0 1 0.75,232V18A17.25,17.25 0 0 1 18,0.75Z" pathLength="1000" fill="none" stroke="#06B6D4" stroke-linecap="round" class="comet" style="animation-duration:8s;animation-delay:-1.3s" stroke-width="2" stroke-dasharray="0 90 70 840"/></svg>
