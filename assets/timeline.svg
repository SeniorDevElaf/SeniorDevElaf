<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-label="Elaf&#x27;s journey from 2020 to now"><title>Elaf&#x27;s journey from 2020 to now</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}}.comet{animation:comet 8s linear infinite}@keyframes comet{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.3);opacity:0}}.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{opacity:0;transform:scale(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="clip"><rect width="1000" height="236" rx="20"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090D17"/><stop offset="1" stop-color="#0E1323"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".6"/><stop offset=".5" stop-color="#222B3D"/><stop offset="1" stop-color="#06B6D4" stop-opacity=".5"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern><linearGradient id="prog" x1="125" y1="0" x2="875" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0.000" stop-color="#06B6D4"/><stop offset="0.333" stop-color="#EC4899"/><stop offset="0.667" stop-color="#F59E0B"/><stop offset="1.000" stop-color="#8B5CF6"/></linearGradient></defs><g cli