<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="GamesHub"><title>GamesHub</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}}.comet{animation:comet 8s linear infinite}@keyframes comet{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.3);opacity:0}}.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{opacity:0;transform:scale(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.halo{transform-box:fill-box;transform-origin:center;animation:halo 7s ease-in-out infinite}@keyframes halo{50%{transform:translate(40px,20px) scale(1.2)}}</style><defs><clipPath id="clip"><rect width="480" height="250" rx="18"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090D17"/><stop offset="1" stop-color="#0E1323"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".6"/><stop offset=".5" stop-color="#222B3D"/><stop offset="1" stop-color="#06B6D4" stop-opacity=".5"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern><radialGradient id="halo"><stop offset="0" stop-color="#EC4899" stop-opacity=".28"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#clip)"><rect width="480" height="250" fill="url(#bg)"/><rect width="480" height="250" fill="url(#dots)"/><circle class="halo" cx="60" cy="40" r="170" fill="url(#halo)"/><rect x="28" y="28" width="52" height="52" rx="14" fill="#EC4899" fill-opacity=".16" stroke="#EC4899" stroke-opacity=".5"/><g transform="translate(39,39) scale(1.25)" fill="none" stroke="#F9A8D4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59l-.9 7.9A3 3 0 0 0 4.8 20a3 3 0 0 0 2.13-.88L9 17h6l2.07 2.12A3 3 0 0 0 19.2 20a3 3 0 0 0 3-3.51l-.9-7.9A4 4 0 0 0 17.32 5z"/></g><text x="96" y="52" class="s" font-size="21" font-weight="700" fill="#F0F3F8">GamesHub</text><text x="97" y="74" class="m" font-size="11.5" letter-spacing="1.6" fill="#F9A8D4">MULTIPLAYER</text><rect x="398.8" y="27" width="53.2" height="24" rx="12" fill="#22C55E" fill-opacity=".12" stroke="#22C55E" stroke-opacity=".5"/><text x="425.4" y="43" class="m" font-size="11" font-weight="700" letter-spacing="1.2" fill="#86EFAC" text-anchor="middle">LIVE</text><text x="28" y="122" class="s" font-size="15" fill="#9BA3B4">Multiplayer gaming platform: create lobbies,</text><text x="28" y="146" class="s" font-size="15" fill="#9BA3B4">invite friends and compete in real time matches.</text><rect x="28" y="190" width="59.5" height="28" rx="14" fill="#141C2E" stroke="#222B3D"/><text x="57.75" y="208.5" class="m" font-size="12.5" fill="#C9D1D9" text-anchor="middle">React</text><rect x="95.5" y="190" width="74.5" height="28" rx="14" fill="#141C2E" stroke="#222B3D"/><text x="132.75" y="208.5" class="m" font-size="12.5" fill="#C9D1D9" text-anchor="middle">Node.js</text><rect x="178" y="190" width="82" height="28" rx="14" fill="#141C2E" stroke="#222B3D"/><text x="219" y="208.5" class="m" font-size="12.5" fill="#C9D1D9" text-anchor="middle">Firebase</text><rect x="268" y="190" width="97" height="28" rx="14" fill="#141C2E" stroke="#222B3D"/><text x="316.5" y="208.5" class="m" font-size="12.5" fill="#C9D1D9" text-anchor="middle">TypeScript</text></g><path d="M18,0.75H462A17.25,17.25 0 0 1 479.25,18V232A17.25,17.25 0 0 1 462,249.25H18A17.25,17.25 0 0 1 0.75,232V18A17.25,17.25 0 0 1 18,0.75Z" fill="none" stroke="url(#edge)" stroke-width="1.5"/><path d="M18,0.75H462A17.25,17.25 0 0 1 479.25,18V232A17.25,17.25 0 0 1 462,249.25H18A17.25,17.25 0 0 1 0.75,232V18A17.25,17.25 0 0 1 18,0.75Z" pathLength="1000" fill="none" stroke="#EC4899" stroke-linecap="round" class="comet" style="animation-duration:8s;animation-delay:-5.2s" stroke-width="5" stroke-opacity=".18" stroke-dasharray="160 840"/><path d="M18,0.75H462A17.25,17.25 0 0 1 479.25,18V232A17.25,17.25 0 0 1 462,249.25H18A17.25,17.25 0 0 1 0.75,232V18A17.25,17.25 0 0 1 18,0.75Z" pathLength="1000" fill="none" stroke="#EC4899" stroke-linecap="round" class="comet" style="animation-duration:8s;animation-delay:-5.2s" stroke-width="2" stroke-dasharray="0 90 70 840"/></svg>
